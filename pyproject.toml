[project]
name = "crawler-visualping-io"
version = "0.1.0"
description = "Crawler + API + UI for detecting exposed passwords on crawled sites."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "playwright==1.62.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "Pillow==11.0.0",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.13.0",
    "piexif==1.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A deliberately practical selection for a first-time lint introduction:
# real bugs and import hygiene (E, F, I), not style opinions (e.g. pyupgrade's
# datetime.UTC-alias preference, or flagging the project's few intentional
# broad `except Exception` clauses, which are already comment-documented).
select = ["E", "F", "I"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
