[project]
name = "crawler-visualping-io"
version = "0.1.0"
description = "Crawler + API + UI for detecting exposed passwords on crawled sites."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "playwright==1.62.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "Pillow==11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
